name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Check traceability and orphan code
        run: node scripts/audit/trace-check.mjs && node scripts/audit/import-graph.mjs

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        if: matrix.node == '24.14.0'
        run: npm audit --omit=dev --audit-level=critical

      - name: Name the failing advisories
        if: failure() && matrix.node == '24.14.0'
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const d = require("./audit.json");
            for (const [name, v] of Object.entries(d.vulnerabilities || {})) {
              const via = v.via.map((x) => typeof x === "string" ? x : `${x.title} ${x.url} (${x.severity}, ${x.range})`).join("; ");
              console.log(`::error title=${v.severity} ${name}::${name} ${v.range} fix=${JSON.stringify(v.fixAvailable)} via ${via}`);
            }'

      - name: Static security analysis (semgrep)
        if: matrix.node == '24.14.0'
        run: |
          pip install semgrep --quiet
          semgrep scan --config auto --error --quiet || true

      - name: Build production bundle
        run: npm run build

      - name: Smoke-test the preview server
        run: node scripts/preview-smoke.mjs

