name: Refresh lockfile (one-off)

# Temporary: bumps DOMPurify in package-lock.json to the patched release
# within Cesium's range, and pushes the lockfile back to this branch.
# Removed in the next commit once the lockfile is updated.
on:
  push:
    branches: [ci/name-audit-advisories]
    paths: [.github/workflows/refresh-lock.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Update DOMPurify in the lockfile only
        run: |
          npm update dompurify --package-lock-only
          node -e 'const d=require("./package-lock.json");console.log("dompurify now", d.packages["node_modules/dompurify"].version)'
          npm audit --omit=dev --audit-level=critical
      - name: Push the lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lockfile: DOMPurify to the patched release (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr)"
          git push
