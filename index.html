<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>God's Eye View</title>
  <!-- Browser tab icon: the DDG loop mark without its disc. The SVG swaps to a
       navy-ink version on light tab bars; PNG and ICO cover older browsers. -->
  <link rel="icon" type="image/svg+xml" href="/brand/ddg-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/ddg-mark-32.png" />
  <link rel="alternate icon" href="/brand/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/ddg-mark-180.png" />
  <meta name="theme-color" content="#06131A" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Start-up loading screen (faded by src/app/startupChrome.js). -->
  <div id="loading-screen">
    <div class="loader-content">
      <img class="loader-mark" src="/brand/ddg-mark-512.png" alt="" width="240" height="240" />
      <div class="loader-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading God's Eye View"><i></i></div>
      <div class="loader-pct" aria-hidden="true">0%</div>
      <p class="loader-status">Initializing world…</p>
      <h2>GOD'S EYE <span class="title-accent">VIEW</span></h2>
    </div>
  </div>

  </div>

  <!-- The globe (Cesium) and the world-overlay label host above it. -->
  <div id="cesiumContainer"></div>
  <div id="world-overlay-root" aria-hidden="true">
    <canvas id="world-overlay-canvas"></canvas>
  </div>
  <div id="world-overlay-actions" class="world-overlay-accessibility" role="region" aria-label="Visible map targets">
    <div id="world-overlay-action-list"></div>
    <div id="world-overlay-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Everything else (top bar, panels, HUD, Director) is built by src/shell. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
